<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dog Bowl Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="head">
      <h1>Water Bowl</h1>
      <span id="conn" class="conn" data-state="connecting">connecting...</span>
    </header>

    <section class="card" id="card" data-state="unknown">
      <div class="status-row">
        <span id="badge" class="badge">--</span>
        <span id="updated" class="updated">waiting for data...</span>
      </div>

      <div class="bowl-wrap">
        <!-- Near eye-level view: the rim reads as a shallow ellipse and the
             bowl shows its profile -- wide flared lip tapering to a small
             base. Transparent, so the water level is directly visible. -->
        <svg class="bowl" viewBox="0 0 240 142" role="img" aria-labelledby="bowlTitle">
          <title id="bowlTitle">Water level in the bowl</title>

          <defs>
            <!-- The vessel's interior volume: water is clipped to this, so it
                 hugs the tapering walls the way real water would. -->
            <clipPath id="vessel">
              <path d="M 24 36 A 96 8 0 0 1 216 36
                       C 210 74 194 105 170 116
                       A 50 5 0 0 1 70 116
                       C 46 105 30 74 24 36 Z"/>
            </clipPath>
          </defs>

          <ellipse class="bowl-shadow" cx="120" cy="126" rx="64" ry="5"/>

          <path class="bowl-glass"
                d="M 16 34 A 104 10 0 0 1 224 34
                   C 218 74 200 106 174 118
                   A 54 6 0 0 1 66 118
                   C 40 106 22 74 16 34 Z"/>

          <g clip-path="url(#vessel)">
            <!-- JS moves this group vertically; the waves inside drift
                 sideways on their own via CSS. -->
            <g id="water" class="water">
              <path class="wave wave-back"
                    d="M -140 2 q 30 -3 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 L 400 220 L -140 220 Z"/>
              <path class="wave wave-front"
                    d="M -140 0 q 30 -4 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 L 400 220 L -140 220 Z"/>
            </g>
          </g>

          <!-- A unit ellipse that JS translates and scales to sit exactly on
               the waterline, shrinking as the level drops into the taper. -->
          <ellipse id="surface" class="water-surface"
                   cx="0" cy="0" rx="1" ry="1" vector-effect="non-scaling-stroke"/>

          <!-- Glass drawn last so its edges sit over the water. -->
          <ellipse class="bowl-base" cx="120" cy="118" rx="54" ry="6"/>
          <path class="bowl-wall"
                d="M 16 34 C 22 74 40 106 66 118
                   A 54 6 0 0 0 174 118
                   C 200 106 218 74 224 34"/>
          <!-- Two ellipses make the rolled lip of a real dog bowl. -->
          <ellipse class="bowl-rim" cx="120" cy="34" rx="104" ry="10"/>
          <ellipse class="bowl-rim-inner" cx="120" cy="36" rx="96" ry="8"/>
          <path class="bowl-shine" d="M 42 48 C 48 76 60 98 76 110"/>
        </svg>
      </div>

      <div class="pct-row">
        <span id="pct" class="pct">--</span><span class="pct-sign">%</span>
      </div>
      <p id="grams" class="grams">waiting for a reading</p>
      <p id="lastRefill" class="last-refill"></p>
      <p id="hint" class="hint"></p>
    </section>

    <section class="card">
      <h2>Recent refills</h2>
      <ul id="refillList" class="refill-list"></ul>
      <p id="refillEmpty" class="hint">No refills recorded yet.</p>
    </section>

    <section class="card">
      <h2>Recent history</h2>
      <svg id="chart" class="chart" viewBox="0 0 600 160" preserveAspectRatio="none"
           role="img" aria-label="Recent water level readings"></svg>
      <p id="chartEmpty" class="hint">No readings logged yet.</p>
    </section>

    <footer class="foot">
      <span id="thresholds"></span>
    </footer>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
